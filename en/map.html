  <script>
    // Anti-flash: resuelve el tema antes del primer render.
    // Prioridad: localStorage > prefers-color-scheme > light (default studio).
    (function() {
      var t = localStorage.getItem("meowrhino-theme");
      if (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) t = "dark";
      if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
      // Marca que hay JS ANTES de que el body se parsee, para que el CSS oculte
      // el bloque pre-renderizado (#seo-prerender) desde el primer pintado: el
      // visitante ve el grid, nunca un destello del contenido estático. Sin JS
      // la clase no se pone y el bloque queda visible como fallback real.
      document.documentElement.classList.add("js");
    })();
  </script>
