<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="meowrhino archive — archivo personal de proyectos, experimentos y curiosidades.">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <title>meowrhino archive</title>
  <link rel="canonical" href="https://meowrhino.studio/archive">
  <!-- Open Graph / redes sociales -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="meowrhino studio">
  <meta property="og:title" content="meowrhino archive">
  <meta property="og:description" content="archivo personal de proyectos, experimentos y curiosidades.">
  <meta property="og:url" content="https://meowrhino.studio/archive">
  <meta property="og:locale" content="es_ES">
  <meta property="og:image" content="https://meowrhino.studio/favicon/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="meowrhino studio — estudio de diseño web en Barcelona">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="meowrhino archive">
  <meta name="twitter:description" content="archivo personal de proyectos, experimentos y curiosidades.">
  <meta name="twitter:image" content="https://meowrhino.studio/favicon/og-image.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="icon" href="favicon/favicon.ico">
  <link rel="preload" href="fonts/inknut-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script>
    // Anti-flash: resuelve el tema antes del primer render.
    // Prioridad: localStorage > prefers-color-scheme > dark (default archive).
    (function() {
      var t = localStorage.getItem("meowrhino-theme");
      if (!t) t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
      if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
      // Marca que hay JS ANTES de que el body se parsee, para que el CSS oculte
      // el bloque pre-renderizado (#seo-prerender) desde el primer pintado.
      // Sin JS la clase no se pone y el bloque queda como versión navegable.
      document.documentElement.classList.add("js");
    })();
  </script>
  <!-- BUILD:preload:start -->
  <!-- BUILD:preload:end -->
</head>
<body>
  <main id="content" role="main">
    <!-- Contenido pre-renderizado por build-seo.js: las mismas categorías y
         enlaces que pinta el grid, disponibles en el primer byte. Oculto por
         CSS en cuanto hay JS y eliminado del DOM por archive-main.js; sin JS se
         queda como versión estática navegable (sustituye al viejo <noscript>,
         que solo enseñaba un email). NO editar a mano: se regenera desde
         archive-data.json en cada build. -->
    <div id="seo-prerender">
      <!-- BUILD:archive:start -->
  <!-- BUILD:archive:end -->
    </div>
  </main>
  <script type="module" src="js/archive-main.js"></script>
</body>
</html>
