  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="meowrhino studio — estudio de diseño web en Barcelona">

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
  <link rel="icon" href="/favicon/favicon.ico">
  <link rel="preload" href="/fonts/inknut-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <!-- El tema antes del primer pintado (y html.js): lo escribe build-seo.js, scriptTemaHTML. -->

  <!-- BUILD:tema:end -->
  <!-- BUILD:preload:start -->
  <!-- BUILD:preload:end -->

         las celdas del grid, disponible en el primer byte para los buscadores.
         Oculto por CSS en cuanto hay JS y eliminado del DOM por main.js; sin JS
         se queda como versión estática navegable. Lo escribe el build en cada
         página, desde data.json y proyectos.json. -->
    <div id="seo-prerender">
