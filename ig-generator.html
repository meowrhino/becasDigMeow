<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ig-generator — meowrhino studio</title>
  <meta name="robots" content="noindex">
  <!-- Generador del carrusel de instagram. Igual que og-generator.html: no es
       una página pública, se abre a mano, se elige variante, formato y tema, y
       se descargan los PNG. Dibuja en <canvas> con la tipografía y los colores
       del sitio, y las cifras salen del cupón.

       Tres formatos (?f=4x5|1x1|9x16): 4:5 para el feed, 1:1 para las
       ubicaciones que recortan a cuadrado, 9:16 para stories y reels. Las
       diapositivas se dibujan siempre contra una caja de 1080×1350 que se
       centra en el lienzo, así que no hay que reflowar nada.

       Hay seis variantes del mismo carrusel, cada una con su propia
       gramática visual, para poder probar cuál tira:

         manifiesto     el original afinado: tipografía enorme, marco, blanco.
         sin            lista de lo que NO hay: fondo oscuro, 3-6 palabras por
                        diapositiva. La que menos texto tiene, y por eso la que
                        mejor entrega debería tener en publicidad.
         catalogo       la prueba primero: una captura de portfolio por
                        diapositiva y un pie de una línea. Casi cero texto.
         factura        el desglose completo del precio, con puntos de relleno
                        y cifras a la derecha. Nadie publica esto.
         consentimiento quién tiene permiso para usar tu trabajo, con gramática
                        de formulario: casillas marcadas y sin marcar.
         preguntas      seis preguntas sobre la web que ya estás pagando, con la
                        raya en blanco donde iría la respuesta.

       El botón «corte pagado (6)» (o ?pagado=1) deja el subconjunto de 6
       tarjetas de cada variante y, en el manifiesto, cambia la diapositiva 1
       por una que no nombra ninguna plataforma: la política de uso de marcas
       de Meta prohíbe que una marca suya sea «la característica más destacada
       o distintiva» de un anuncio, y la palabra a 150px lo es sin discusión.
       El gancho bueno se queda para el orgánico.

       No se despliega: está en .assetsignore a propósito, para que no exista
       en el dominio y no haya nada que indexar. Vive en local.

       OJO: ábrelo servido (npx serve . y luego localhost:3000/ig-generator.html),
       no con doble clic desde el Finder: con file:// las capturas de portfolio
       contaminan el canvas y el navegador bloquea la descarga. -->
  <style>
    @font-face {
      font-family: "Inknut Antiqua"; font-style: normal; font-weight: 400; font-display: block;
      src: url("fonts/inknut-400-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: "Inknut Antiqua"; font-style: normal; font-weight: 600; font-display: block;
      src: url("fonts/inknut-600-latin.woff2") format("woff2");
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 2rem 1.5rem 4rem; background: #444;
      font-family: "Inknut Antiqua", serif; color: #eee;
    }
    header { max-width: 1200px; margin: 0 auto 2rem; display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; }
    h1 { font-size: 1rem; font-weight: 600; margin: 0 auto 0 0; }
    button, select {
      font-family: inherit; font-size: .8rem; padding: .5rem .9rem; cursor: pointer;
      border: 1px solid #888; background: #fff; color: #111; border-radius: 4px;
    }
    button:hover { background: #ddd; }
    button[aria-pressed="true"] { background: #1c48d8; color: #fff; border-color: #1c48d8; }
    .slides {
      max-width: 1200px; margin: 0 auto;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 2rem;
    }
    figure { margin: 0; display: flex; flex-direction: column; gap: .6rem; }
    canvas { width: 100%; height: auto; box-shadow: 0 6px 30px rgba(0,0,0,.45); background: #fff; }
    figcaption { display: flex; align-items: center; gap: .6rem; font-size: .7rem; color: #bbb; }
    figcaption button { font-size: .7rem; padding: .3rem .6rem; }
    .copy { max-width: 1200px; margin: 3rem auto 0; }
    .copy h2 { font-size: .9rem; }
    .copy p { font-size: .75rem; color: #bbb; line-height: 1.7; max-width: 60ch; }
    textarea {
      width: 100%; min-height: 15rem; padding: 1rem; font-family: ui-monospace, monospace;
      font-size: .8rem; line-height: 1.6; border-radius: 6px; border: 1px solid #888;
    }
  </style>
</head>
<body>
  <header>
    <h1>ig-generator — carrusel</h1>
    <select id="variante"></select>
    <select id="formato"></select>
    <button id="toggle">cambiar a oscuro</button>
    <button id="pagado" aria-pressed="false">corte pagado (6)</button>
    <button id="guia" aria-pressed="false">guía de recorte</button>
    <button id="download-all">descargar todas</button>
  </header>

  <div class="slides" id="slides"></div>

  <section class="copy">
    <h2>texto del post (para copiar)</h2>
    <textarea id="caption" spellcheck="false"></textarea>
    <p id="nota"></p>
  </section>

  <script>
    const W = 1080, H = 1350;   // H es el alto de la CAJA DE COMPOSICIÓN, no del lienzo

    // Los tres formatos. Todas las diapositivas se dibujan contra una caja de
    // 1080×1350 y luego se centran verticalmente en el lienzo del formato, así
    // que ninguna de las 48 funciones de dibujo necesita saber nada de esto:
    //
    //   4x5   el lienzo ES la caja. Lo de siempre.
    //   9x16  sobran 285px arriba y abajo, que se quedan de fondo. Justo lo que
    //         recomienda meta para stories, donde la interfaz se come los
    //         extremos: el letterbox hace de safe zone.
    //   1x1   faltan 135px arriba y abajo, así que se recorta por el centro.
    //         Comprobado con la guía: lo único que caía fuera era el pie, y el
    //         pie se redibuja en las coordenadas del lienzo, no de la caja.
    const FORMATOS = {
      "4x5":  { alto: 1350, nombre: "4:5 · feed" },
      "1x1":  { alto: 1080, nombre: "1:1 · feed cuadrado" },
      "9x16": { alto: 1920, nombre: "9:16 · stories y reels" },
    };
    let formatoActual = "4x5";
    const alto = () => FORMATOS[formatoActual].alto;
    const desfase = () => Math.round((alto() - H) / 2);

    const TEMAS = {
      light: { bg: "#ffffff", text: "#000000", muted: "#717171", line: "rgba(0,0,0,.14)", acento: "#1c48d8" },
      dark:  { bg: "#121212", text: "#e0e0e0", muted: "#808080", line: "rgba(224,224,224,.16)", acento: "#6f8dff" },
    };

    // Las cuatro capturas que van en la diapositiva de prueba del manifiesto:
    // dos claras y dos oscuras, en diagonal, para que la retícula no se apelmace.
    const CAPTURAS = [
      "img/elmundodelasjordis/1.webp",
      "img/estructuras3000/1.webp",
      "img/villagranota/1.webp",
      "img/viciostorpes/1.webp",
    ];

    // El catálogo: una web por diapositiva, con el resumen tal cual está en
    // proyectos-seo.json. Elegidas por lo raras que son, no por lo bonitas.
    const CATALOGO = [
      { img: "img/villagranota/1.webp",      nombre: "villagranota",          pie: "una web experimento con rana" },
      { img: "img/mikebros/1.webp",          nombre: "mike bros",             pie: "un portfolio que es una disquetera" },
      { img: "img/christine/1.webp",         nombre: "christine",             pie: "un portfolio que se reordena según lo que preguntes" },
      { img: "img/estructuras3000/1.webp",   nombre: "estructuras3000",       pie: "una web para colectivizar materiales" },
      { img: "img/ladiega/1.webp",           nombre: "la diega",              pie: "un portfolio de sonido que suena" },
      { img: "img/elmundodelasjordis/1.webp", nombre: "el mundo de las jordis", pie: "un diario a varias manos" },
    ];

    const FOTO = "img/manu/manu.webp";
    const imgs = {};

    // ---------- helpers de dibujo ----------

    const M = 96;            // margen lateral
    const ANCHO = W - M * 2; // ancho útil

    function fuente(size, weight = 400) { return `${weight} ${size}px "Inknut Antiqua"`; }

    // Parte un texto en líneas que quepan en maxW.
    function partir(ctx, txt, maxW) {
      const palabras = txt.split(" ");
      const lineas = [];
      let linea = "";
      for (const p of palabras) {
        const prueba = linea ? linea + " " + p : p;
        if (ctx.measureText(prueba).width > maxW && linea) { lineas.push(linea); linea = p; }
        else linea = prueba;
      }
      if (linea) lineas.push(linea);
      return lineas;
    }

    // Escribe texto (con salto automático) y devuelve la y de la última línea.
    function escribir(ctx, txt, o = {}) {
      const size = o.size || 38, weight = o.weight || 400;
      const alto = o.lineHeight || size * 1.5;
      const maxW = o.maxWidth || ANCHO;
      ctx.font = fuente(size, weight);
      ctx.fillStyle = o.color || "#000";
      ctx.textAlign = o.align || "left";
      ctx.letterSpacing = (o.tracking || 0) + "px";
      const x = o.x != null ? o.x : (o.align === "center" ? W / 2 : M);
      let y = o.y;
      for (const l of partir(ctx, txt, maxW)) { ctx.fillText(l, x, y); y += alto; }
      ctx.letterSpacing = "0px";
      return y - alto;
    }

    // Ajusta el cuerpo para que una sola línea ocupe el ancho pedido.
    function escribirAjustado(ctx, txt, o = {}) {
      const maxW = o.maxWidth || ANCHO;
      ctx.font = fuente(100, o.weight || 600);
      const medido = ctx.measureText(txt).width;
      const size = Math.min(o.max || 160, Math.round((100 * maxW) / medido));
      return escribir(ctx, txt, { ...o, size, lineHeight: size * 1.18, maxWidth: W * 4 });
    }

    // Varias líneas, cada una ajustada al ancho: el bloque queda justificado
    // por los dos lados y con tamaños distintos. Es el gesto de la variante
    // «sin». Devuelve la y de la última línea.
    function gigante(ctx, lineas, o = {}) {
      const maxW = o.maxWidth || ANCHO;
      const tamanos = lineas.map((l) => {
        ctx.font = fuente(100, 600);
        return Math.min(o.max || 170, Math.round((100 * maxW) / ctx.measureText(l).width));
      });
      let y = o.y0 + Math.round(tamanos[0] * 0.82);
      lineas.forEach((l, i) => {
        escribir(ctx, l, {
          y, size: tamanos[i], weight: 600, tracking: -3,
          color: o.color, maxWidth: W * 4, lineHeight: tamanos[i],
        });
        y += Math.round(tamanos[i] * 1.06);
      });
      return y - Math.round(tamanos[tamanos.length - 1] * 1.06);
    }

    function regla(ctx, y, c, ancho = ANCHO) {
      ctx.strokeStyle = c.line; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(M, y); ctx.lineTo(M + ancho, y); ctx.stroke();
    }

    // Una fila de factura: concepto a la izquierda, cifra a la derecha y
    // puntos de relleno en medio.
    function fila(ctx, c, y, izq, der, o = {}) {
      const size = o.size || 34;
      ctx.letterSpacing = "0px";
      ctx.textAlign = "left";
      ctx.font = fuente(size, 400);
      ctx.fillStyle = o.color || c.text;
      ctx.fillText(izq, M, y);
      const wIzq = ctx.measureText(izq).width;
      ctx.font = fuente(size, o.pesoDer || 600);
      ctx.fillStyle = o.colorDer || o.color || c.text;
      const wDer = ctx.measureText(der).width;
      ctx.textAlign = "right";
      ctx.fillText(der, W - M, y);
      ctx.textAlign = "left";
      const x0 = M + wIzq + 14, x1 = W - M - wDer - 14;
      if (x1 > x0) {
        ctx.font = fuente(size, 400);
        ctx.fillStyle = c.muted;
        for (let x = x0; x < x1; x += 20) ctx.fillText("·", x, y);
      }
    }

    // Una casilla de formulario de consentimiento, marcada o sin marcar, con
    // su etiqueta al lado. Es el gesto de la variante «consentimiento».
    // Devuelve la y de la última línea de la etiqueta.
    function casilla(ctx, c, y, txt, o = {}) {
      const lado = 34, x = M;
      ctx.strokeStyle = o.color || c.text; ctx.lineWidth = 3;
      ctx.strokeRect(x, y - lado + 6, lado, lado);
      if (o.marcada) {
        ctx.beginPath();
        ctx.moveTo(x + 7, y - lado + 13); ctx.lineTo(x + lado - 7, y - 1);
        ctx.moveTo(x + lado - 7, y - lado + 13); ctx.lineTo(x + 7, y - 1);
        ctx.stroke();
      }
      return escribir(ctx, txt, {
        y, x: x + lado + 26, size: o.size || 34, lineHeight: 54,
        color: o.color || c.text, maxWidth: ANCHO - lado - 26,
      });
    }

    // Dibuja una imagen recortada (object-fit: cover) dentro de un rectángulo.
    function cubrir(ctx, img, x, y, w, h, zoom = 1) {
      if (!img) { ctx.fillStyle = "rgba(128,128,128,.25)"; ctx.fillRect(x, y, w, h); return; }
      const escala = Math.max(w / img.width, h / img.height) * zoom;
      const iw = img.width * escala, ih = img.height * escala;
      ctx.save();
      ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
      ctx.drawImage(img, x + (w - iw) / 2, y + (h - ih) / 2, iw, ih);
      ctx.restore();
    }

    // Marco y pie comunes. Cada diapositiva puede devolver opciones para
    // cambiarlos: {marco:false} lo quita, {pieY} lo mueve, {etiqueta} cambia
    // el texto de la izquierda.
    function chrome(ctx, c, n, total, o = {}) {
      const hh = alto(), d = desfase();
      // Marco y pie se pegan al borde del lienzo, salvo en 9:16, donde se
      // quedan pegados a la caja de composición: si no, caen dentro de las
      // bandas de 250px que tapa la interfaz de stories.
      const arriba = Math.max(44, d + 44);
      const abajo = Math.min(hh - 44, d + H - 44);
      if (o.marco !== false) {
        ctx.strokeStyle = c.line; ctx.lineWidth = 2;
        ctx.strokeRect(44, arriba, W - 88, abajo - arriba);
      }
      if (o.pie === false) return;
      const y = o.pieY || abajo - 34;
      escribir(ctx, o.etiqueta || "meowrhino.studio", { y, size: 22, color: c.muted });
      escribir(ctx, n + "/" + total, { y, size: 22, color: c.muted, align: "right", x: W - M });
    }

    // La guía de recorte: el cuadrado 1:1 centrado (lo que se ve si la
    // ubicación recorta a cuadrado) y el 80% central, que es la safe zone que
    // recomienda meta. No sale en el PNG: solo se pinta en pantalla.
    function guiaRecorte(ctx) {
      const hh = alto();
      ctx.save();
      ctx.setLineDash([14, 10]);
      ctx.lineWidth = 3;
      ctx.font = fuente(20, 600);

      // el 80% central que recomienda meta, en cualquier formato
      ctx.strokeStyle = "rgba(0,200,255,.85)";
      ctx.strokeRect(W * 0.1, hh * 0.1, W * 0.8, hh * 0.8);
      ctx.fillStyle = "rgba(0,200,255,.85)";
      ctx.fillText("safe zone 80%", W * 0.1 + 10, hh * 0.1 - 12);

      ctx.strokeStyle = "rgba(255,0,140,.85)";
      ctx.fillStyle = "rgba(255,0,140,.85)";
      if (formatoActual === "4x5") {
        // qué se pierde si la ubicación recorta a cuadrado
        ctx.strokeRect(0, (hh - W) / 2, W, W);
        ctx.fillText("1:1", 12, (hh - W) / 2 - 12);
      } else if (formatoActual === "9x16") {
        // las bandas que se come la interfaz de stories
        for (const y of [250, hh - 250]) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        }
        ctx.fillText("interfaz de stories", 12, 240);
      }
      ctx.setLineDash([]);
      ctx.restore();
    }

    // ---------- A · manifiesto ----------
    // El original, con un 40% menos de palabras: en publicidad los bloques
    // densos de texto se entregan peor. El gancho no se toca, y «si aprendiste
    // a tocarla tú, no pagas» sube a la diapositiva del precio.

    const MANIFIESTO = [
      // 1 · el gancho: el anuncio se ríe del sitio donde está
      (ctx, c) => {
        escribirAjustado(ctx, "internet", { y: 520, weight: 600, tracking: -3, maxWidth: ANCHO, max: 150, color: c.text });
        escribirAjustado(ctx, "no es", { y: 680, weight: 600, tracking: -3, maxWidth: ANCHO * .62, max: 150, color: c.text });
        escribirAjustado(ctx, "instagram.", { y: 840, weight: 600, tracking: -3, maxWidth: ANCHO, max: 150, color: c.text });
        escribir(ctx, "(y aun así, aquí estamos)", { y: 960, size: 30, color: c.muted });
      },

      // 2 · qué es internet entonces
      (ctx, c) => {
        escribir(ctx, "internet son también todas esas páginas pequeñas que alguien hizo porque quería contar, enseñar o compartir algo.",
          { y: 440, size: 46, lineHeight: 76, color: c.text });
        regla(ctx, 880, c);
        escribir(ctx, "un sitio al que se llega a propósito.",
          { y: 960, size: 34, lineHeight: 56, color: c.muted });
      },

      // 3 · la propiedad, explicada en vez de afirmada
      (ctx, c) => {
        escribir(ctx, "¿qué significa que una web sea tuya?",
          { y: 300, size: 58, weight: 600, tracking: -2, lineHeight: 88, color: c.text });
        regla(ctx, 500, c);
        let y = 640;
        for (const p of ["el dominio.", "el código.", "el repositorio."]) {
          escribir(ctx, "·", { y, size: 42, color: c.muted });
          escribir(ctx, p, { y, x: M + 46, size: 42, color: c.text });
          y += 120;
        }
        regla(ctx, 1030, c);
        escribir(ctx, "todo a tu nombre.", { y: 1130, size: 46, weight: 600, tracking: -1, color: c.acento });
      },

      // 4 · lo que no hay: cuotas
      (ctx, c) => {
        escribir(ctx, "sin servidores, sin suscripciones, sin cuotas.",
          { y: 460, size: 58, weight: 600, lineHeight: 94, tracking: -1, color: c.text });
        regla(ctx, 820, c);
        escribir(ctx, "el dominio es prácticamente el único gasto que se repite.",
          { y: 900, size: 34, lineHeight: 56, color: c.muted });
      },

      // 5 · la prueba: cuatro webs de verdad
      (ctx, c) => {
        escribir(ctx, "21 webs desde cero, desde 2020", { y: 230, size: 40, weight: 600, tracking: -1, color: c.text });
        const gap = 36, cw = (ANCHO - gap) / 2, ch = Math.round(cw * 0.66);
        const y0 = 320;
        CAPTURAS.forEach((src, i) => {
          const x = M + (i % 2) * (cw + gap);
          const y = y0 + Math.floor(i / 2) * (ch + gap);
          cubrir(ctx, imgs[src], x, y, cw, ch, 1.1);
          ctx.strokeStyle = c.line; ctx.lineWidth = 2; ctx.strokeRect(x, y, cw, ch);
        });
        escribir(ctx, "sencillas, extrañas, experimentales o completamente absurdas.",
          { y: y0 + 2 * (ch + gap) + 70, size: 32, lineHeight: 54, color: c.muted });
      },

      // 6 · lo que quita el miedo, sin la lista de pasos
      (ctx, c) => {
        escribir(ctx, "no hace falta que sepas hacer una web.",
          { y: 380, size: 56, weight: 600, lineHeight: 92, tracking: -1, color: c.text });
        escribir(ctx, "hace falta que sepas qué quieres enseñar.",
          { y: 660, size: 56, weight: 600, lineHeight: 92, tracking: -1, color: c.muted });
        regla(ctx, 960, c);
        escribir(ctx, "me lo cuentas, la hago en un mes, te la entrego en persona y sales sabiendo actualizarla.",
          { y: 1040, size: 30, lineHeight: 52, color: c.muted });
      },

      // 7 · el precio, sin rodeos
      (ctx, c) => {
        escribir(ctx, "tu web en un mes por", { y: 420, size: 40, color: c.muted, align: "center" });
        escribirAjustado(ctx, "850 €", { y: 640, weight: 600, tracking: -4, align: "center", maxWidth: ANCHO * .8, max: 220, color: c.acento });
        escribir(ctx, "(iva no incluido)", { y: 710, size: 26, color: c.muted, align: "center" });
        regla(ctx, 830, c);
        escribir(ctx, "3 entregas · 1 ronda de cambios en cada una",
          { y: 910, size: 28, color: c.muted, align: "center", x: W / 2 });
        escribir(ctx, "después, 60 €/hora para lo que quieras tocar.",
          { y: 1010, size: 34, lineHeight: 56, color: c.text, align: "center", x: W / 2 });
        escribir(ctx, "y si aprendiste a tocarla tú, no pagas.",
          { y: 1110, size: 34, lineHeight: 56, color: c.acento, align: "center", x: W / 2 });
      },

      // 8 · la llamada primero, la cara como firma
      (ctx, c) => {
        escribir(ctx, "la primera reunión es gratis y no compromete a nada.",
          { y: 320, size: 60, weight: 600, lineHeight: 96, tracking: -2, color: c.text });
        escribir(ctx, "mándame un mensaje →", { y: 700, size: 46, weight: 600, color: c.acento });
        regla(ctx, 800, c);
        cubrir(ctx, imgs[FOTO], M, 880, 300, 300);
        ctx.strokeStyle = c.line; ctx.lineWidth = 2; ctx.strokeRect(M, 880, 300, 300);
        escribir(ctx, "detrás de meowrhino está manu latour. diseño y programo webs a medida desde barcelona.",
          { y: 950, x: M + 340, size: 30, lineHeight: 52, color: c.muted, maxWidth: ANCHO - 340 });
        return { etiqueta: "hola@meowrhino.studio" };
      },
    ];

    // ---------- B · sin ----------
    // Un anuncio que enumera lo que NO te da. Tres a seis palabras por
    // diapositiva: es la variante con menos texto y la más incómoda de leer
    // como publicidad, que es justo el punto.

    function sinSlide(sustantivo, nota) {
      return (ctx, c) => {
        escribir(ctx, "sin", { y: 470, size: 40, color: c.muted, tracking: 2 });
        gigante(ctx, sustantivo, { y0: 520, color: c.text, max: 170 });
        regla(ctx, 1000, c);
        escribir(ctx, nota, { y: 1075, size: 31, lineHeight: 52, color: c.muted });
        return { marco: false };
      };
    }

    const SIN = [
      // 1 · el gancho deja la frase a medias: hay que deslizar para cerrarla
      (ctx, c) => {
        escribirAjustado(ctx, "una web", { y: 580, weight: 600, tracking: -3, maxWidth: ANCHO, max: 150, color: c.text });

    // ---------- montaje ----------

    const params = new URLSearchParams(location.search);
    let varActual = VARIANTES[params.get("v")] ? params.get("v") : "manifiesto";
    let temaActual = params.get("tema") === "dark" ? "dark"
      : params.get("tema") === "light" ? "light" : VARIANTES[varActual].tema;
    let conGuia = false;
    let pagado = params.get("pagado") === "1";

    // Las diapositivas que se pintan: las 8 en orgánico, el corte de 6 en
    // pagado (los anuncios de carrusel admiten de 2 a 10 tarjetas, y 8 de
    // texto denso se entregan peor que 6).
    function activas() {
      const v = VARIANTES[varActual];
      if (!pagado || !v.corto) return v.slides;
      return v.corto.map((i) => (v.sust && v.sust[i]) || v.slides[i]);
    }
    const solo = parseInt(params.get("solo"), 10);

    const cont = document.getElementById("slides");
    const selector = document.getElementById("variante");
    for (const [k, v] of Object.entries(VARIANTES)) {
      const op = document.createElement("option");
      op.value = k; op.textContent = v.nombre;
      selector.append(op);
    }
    selector.value = varActual;

    const selFormato = document.getElementById("formato");
    for (const [k, f] of Object.entries(FORMATOS)) {
      const op = document.createElement("option");
      op.value = k; op.textContent = f.nombre;
      selFormato.append(op);
    }
    if (FORMATOS[params.get("f")]) formatoActual = params.get("f");
    selFormato.value = formatoActual;
    selFormato.addEventListener("change", () => {
      formatoActual = selFormato.value;
      montar();
      render();
    });

    let canvases = [];

    function montar() {
      cont.textContent = "";
      canvases = activas().map((_, i) => {
        const fig = document.createElement("figure");
        const cv = document.createElement("canvas");
        cv.width = W; cv.height = alto();
        const cap = document.createElement("figcaption");
        const b = document.createElement("button");
        b.textContent = "png";
        b.addEventListener("click", () => descargar(i));
        cap.append(document.createTextNode(String(i + 1).padStart(2, "0")), b);
        fig.append(cv, cap);
        cont.append(fig);
        return cv;
      });
    }

    function pintar(i, guia) {
      const v = VARIANTES[varActual];
      const c = TEMAS[temaActual];
      const lista = activas();
      const ctx = canvases[i].getContext("2d");
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = c.bg; ctx.fillRect(0, 0, W, alto());
      ctx.textBaseline = "alphabetic";
      // la diapositiva se dibuja contra la caja de 1350, centrada en el lienzo
      ctx.save();
      ctx.translate(0, desfase());
      const o = lista[i](ctx, c) || {};
      ctx.restore();
      chrome(ctx, c, i + 1, lista.length, { marco: v.marco, ...o });
      if (guia) guiaRecorte(ctx);
    }

    function descargar(i) {
      if (conGuia) pintar(i, false);   // la guía no va en el png
      const a = document.createElement("a");
      a.download = `meowrhino-ig-${varActual}${pagado ? "-pagado" : ""}-${String(i + 1).padStart(2, "0")}-${temaActual}-${formatoActual}.png`;
      a.href = canvases[i].toDataURL("image/png");
      a.click();
      if (conGuia) pintar(i, true);
    }

    function render() {
      const v = VARIANTES[varActual];
      const lista = activas();
      if (canvases.length !== lista.length || (canvases[0] && canvases[0].height !== alto())) montar();
      document.getElementById("toggle").textContent =
        temaActual === "light" ? "cambiar a oscuro" : "cambiar a claro";
      document.getElementById("pagado").setAttribute("aria-pressed", String(pagado));
      document.getElementById("guia").setAttribute("aria-pressed", String(conGuia));
      lista.forEach((_, i) => pintar(i, conGuia));
      document.getElementById("caption").value = v.caption;
      document.getElementById("nota").textContent = v.nota;
      aplicarSolo();
    }

    selector.addEventListener("change", () => {
      varActual = selector.value;
      temaActual = VARIANTES[varActual].tema;   // cada variante tiene su tema base
      montar();
      render();
    });
    document.getElementById("toggle").addEventListener("click", () => {
      temaActual = temaActual === "light" ? "dark" : "light";
      render();
    });
    document.getElementById("pagado").addEventListener("click", (e) => {
      pagado = !pagado;
      e.currentTarget.setAttribute("aria-pressed", String(pagado));
      montar();
      render();
    });
    document.getElementById("guia").addEventListener("click", (e) => {
      conGuia = !conGuia;
      e.currentTarget.setAttribute("aria-pressed", String(conGuia));
      render();
    });
    document.getElementById("download-all").addEventListener("click", () => {
      canvases.forEach((_, i) => setTimeout(() => descargar(i), i * 350));
    });

    // Modo pieza suelta: ?solo=3 deja una sola diapositiva a tamaño real
    // (1080×1350) y esconde el resto de la página. Sirve para mirarla de cerca
    // y, sobre todo, para exportarlas en lote desde fuera:
    //   brave --headless --window-size=1080,1350 \
    //     --screenshot=01.png "http://localhost:3000/ig-generator?v=sin&solo=1"
    // Con ?tema=dark sale la versión oscura.
    // OJO: sin el .html. `npx serve` redirige /ig-generator.html a
    // /ig-generator y por el camino se pierde la query, así que con la
    // extensión los parámetros no llegan nunca.
    function aplicarSolo() {
      if (!(solo >= 1 && solo <= canvases.length)) return;
      document.body.style.cssText = "margin:0;padding:0;background:#fff";
      document.querySelector("header").style.display = "none";
      document.querySelector(".copy").style.display = "none";
      cont.style.cssText = "max-width:none;margin:0;display:block";
      document.querySelectorAll("figure").forEach((f, i) => {
        f.style.display = i === solo - 1 ? "block" : "none";
      });
      const cv = canvases[solo - 1];
      cv.style.cssText = `width:1080px;height:${alto()}px;box-shadow:none;display:block`;
      cv.nextElementSibling.style.display = "none";
    }

    function cargar(src) {
      return new Promise((res) => {
        const img = new Image();
        img.onload = () => { imgs[src] = img; res(); };
        img.onerror = () => res();
        img.src = src;
      });
    }

    const TODAS = [...new Set([...CAPTURAS, ...CATALOGO.map((x) => x.img), FOTO])];

    montar();
    Promise.all([
      document.fonts.load('600 160px "Inknut Antiqua"'),
      document.fonts.load('400 38px "Inknut Antiqua"'),
      ...TODAS.map(cargar),
    ]).then(render).catch(render);
  </script>
